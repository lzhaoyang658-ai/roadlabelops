name: 功能建议
description: 提议新的能力或工作流改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 描述要解决的问题、使用者和当前替代方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的行为、输入输出和验收标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍
      description: 说明考虑过的其他方法，以及兼容性、安全或运维影响。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和 Pull Request，未发现相同建议。
          required: true
        - label: 建议不要求绕过人工审核、权限或 Release 完整性边界。
          required: true
